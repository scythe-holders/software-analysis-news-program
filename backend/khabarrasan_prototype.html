function read(key,fallback){try{const val=localStorage.getItem(key);return val===null?structuredClone(fallback):JSON.parse(val)}catch(e){return JSON.parse(JSON.stringify(fallback))}};

function dateNow(){return new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())};

function submitPage(){const old=editingId?reports.find(r=>r.id===editingId&&r.user_id===session.id):null;return `${header(old?'ویرایش و ارسال مجدد':'ارسال خبر جدید',old?'اصلاحات خواسته‌شده را اعمال و خبر را دوباره ارسال کنید.':'خبر خود را در یکی از بخش‌های خبری ثبت کنید.')}<div class="two-col wide"><section class="panel"><div class="panel-header"><h3>${I('edit')} اطلاعات گزارش</h3></div><div class="panel-body"><form id="submit-form"><div class="form-grid"><div class="field span2"><label>عنوان خبر <em>*</em></label><input class="control" name="title" placeholder="مثلاً: برگزاری جشنواره ورزشی در شهر" required maxlength="200" value="${safe(old?.title||'')}"/></div><div class="field"><label>بخش خبری <em>*</em></label><select class="control" name="program_id" required><option value="">انتخاب بخش خبری</option>${programs.map(p=>`<option value="${p.id}" ${old?.program_id===p.id?'selected':''}>${p.name}</option>`).join('')}</select></div><div class="field"><label>نام نویسنده</label><input class="control" value="${safe(session.name)}" disabled/></div><div class="field span2"><label>متن و توضیحات خبر <em>*</em></label><textarea class="control textarea" name="summary" required minlength="20" placeholder="شرح کامل خبر، زمان، مکان و منبع اطلاعات را وارد کنید...">${safe(old?.summary||'')}</textarea><div class="hint">برای بررسی سریع‌تر، اطلاعات دقیق و قابل استناد بنویسید.</div></div><div class="field span2"><label>عکس یا ویدیوی پیوست (اختیاری)</label><label class="upload-zone" for="media-input">${I('upload')}<strong>برای انتخاب فایل کلیک کنید</strong><small>فرمت‌های پیشنهادی: JPG، PNG، MP4 — فقط نمایش نمونه، بدون آپلود واقعی</small><span id="file-names" class="file-names">${old?.files?.length?'فایل‌های قبلی: '+old.files.map(safe).join('، '):''}</span></label><input type="file" id="media-input" accept="image/*,video/*" multiple style="display:none"/></div></div><div class="form-actions"><button class="button secondary" type="button" data-go="reports">انصراف</button><button class="button primary" type="submit">${I('send')} ${old?'ارسال مجدد برای بررسی':'ثبت و ارسال خبر'}</button></div></form></div></section><div><section class="panel"><div class="panel-header"><h3>${I('file')} راهنمای ارسال</h3></div><div class="panel-body"><div class="info-card"><strong>بعد از ثبت خبر چه اتفاقی می‌افتد؟</strong><br/>خبر با وضعیت «در انتظار بررسی» ذخیره می‌شود. مدیر می‌تواند خبر را تأیید، رد یا برای اصلاح برگرداند. فقط خبرهای تأییدشده در سایت عمومی نمایش داده می‌شوند.</div><h3 class="subheading">قوانین کوتاه ارسال</h3><p class="note">• عنوان روشن و دقیق بنویسید.<br/>• از انتشار اطلاعات نادرست خودداری کنید.<br/>• عکس‌ها و ویدیوهای مرتبط ضمیمه کنید.<br/>• برای اصلاحات، بخش «آثار من» را بررسی کنید.</p></div></section>${old?.feedback?`<section class="panel section-gap"><div class="panel-header"><h3>${I('edit')} پیام مدیر</h3></div><div class="panel-body"><div class="info-card">${safe(old.feedback)}</div></div></section>`:''}</div></div>`};
function reportsPage(){const admin=session.role==='admin',list=reports.filter(r=>!r.deleted_at&&(admin||r.user_id===session.id)).filter(r=>reportFilter==='all'||r.status===reportFilter);return `${header(admin?'گزارش‌های ارسالی':'آثار و درخواست‌های من',admin?'تمامی خبرهای ثبت‌شده و وضعیت بررسی آن‌ها.':'پیگیری گزارش‌ها، مشاهده بازخورد مدیر و اصلاح خبرها.',`<button class="button primary" data-go="submit">${I('send')} خبر جدید</button>`)}<section class="panel"><div class="panel-header"><h3>${I('filter')} فیلتر گزارش‌ها</h3></div><div class="panel-body"><div class="filters">${[['all','همه'],['pending','در انتظار بررسی'],['changes_requested','نیاز به اصلاح'],['approved','منتشر شده'],['rejected','رد شده']].map(([key,label])=>`<button class="filter ${reportFilter===key?'active':''}" data-filter="${key}">${label}</button>`).join('')}</div><div class="table-wrap"><table class="data-table"><thead><tr><th>شناسه</th><th>عنوان خبر</th><th>بخش</th>${admin?'<th>ارسال‌کننده</th>':''}<th>تاریخ</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>${list.map(r=>`<tr><td>#${r.id}</td><td class="title-cell">${safe(r.title)}</td><td>${pName(r.program_id)}</td>${admin?`<td>${safe(r.author)}</td>`:''}<td>${safe(r.created_at)}</td><td>${status(r.status)}</td><td><button class="link-btn" data-review="${r.id}">${admin?'بررسی / مشاهده':r.status==='changes_requested'?'اصلاح خبر':'مشاهده'} ←</button></td></tr>`).join('')||`<tr><td colspan="7">${empty('گزارشی با این وضعیت پیدا نشد.')}</td></tr>`}</tbody></table></div></div></section>`};
function reviewPage(){const r=reports.find(r=>r.id===reviewingId);if(!r)return reportsPage();const admin=session?.role==='admin',my=!!session&&r.user_id===session.id;return `${header(admin?'بررسی خبر':'جزئیات خبر',`شناسه خبر #${r.id} • ${pName(r.program_id)}`,`<button class="button secondary" data-go="reports">${I('arrow')} بازگشت</button>`)}<div class="two-col wide"><section class="panel"><div class="panel-header"><h3>${I('news')} متن خبر</h3>${status(r.status)}</div><div class="panel-body"><h2 class="article-title">${safe(r.title)}</h2><div class="article-meta">${I('users')} ${safe(r.author)} &nbsp; • &nbsp; ${pName(r.program_id)} &nbsp; • &nbsp; ${safe(r.created_at)}</div><p class="article-body">${safe(r.summary)}</p><div class="review-media">${I('image')}<p>${r.files.length?`پیوست‌ها: ${r.files.map(safe).join('، ')}`:'این خبر فایل پیوست ندارد.'}</p><small>در نسخه نمونه، فایل‌ها در سرور ذخیره نمی‌شوند.</small></div>${r.feedback?`<h3 class="subheading">بازخورد مدیر</h3><div class="info-card">${safe(r.feedback)}</div>`:''}</div></section><div><section class="panel"><div class="panel-header"><h3>${I(admin?'shield':'clock')} ${admin?'تصمیم مدیر':'وضعیت بررسی'}</h3></div><div class="panel-body"><p class="note">${admin?'خبر را بررسی کنید. انتخاب هر تصمیم وضعیت آن را تغییر می‌دهد.':'این بخش نتیجه آخرین بررسی خبر شما را نشان می‌دهد.'}</p>${admin?`<label class="field"><label>توضیح برای نویسنده</label><textarea class="control textarea" id="admin-feedback" placeholder="علت رد شدن یا مواردی که باید اصلاح شوند...">${safe(r.feedback||'')}</textarea></label><div class="review-stack" style="margin-top:17px"><button class="button success" data-decision="approved">${I('check')} تأیید و انتشار خبر</button><button class="button secondary" data-decision="changes_requested">${I('edit')} بازگشت برای اصلاح</button><button class="button danger" data-decision="rejected">${I('cross')} رد درخواست</button>${r.status==='approved'?`<button class="button danger" data-decision="removed">${I('trash')} حذف از نمایش عمومی</button>`:''}</div>`:my&&r.status==='changes_requested'?`<button class="button primary" id="edit-report">${I('edit')} ویرایش و ارسال مجدد</button>`:`<div class="info-card">وضعیت فعلی: ${status(r.status)}<br/>${r.status==='approved'?'این خبر در صفحه عمومی قابل مشاهده است.':r.status==='pending'?'خبر شما در صف بررسی مدیر قرار دارد.':r.status==='rejected'?'این خبر منتشر نمی‌شود.':'از قسمت آثار من می‌توانید وضعیت را پیگیری کنید.'}</div>`}</div></section></div></div>`};
function programsPage(){return `${header('بخش‌های خبری','برای ارسال خبر یکی از این برنامه‌ها را انتخاب کنید.')}<div class="program-cards">${programs.map(p=>`<div class="program-card"><div class="program-symbol">${I(p.icon)}</div><div><h3>${p.name}</h3><p>${p.desc}</p></div><button class="link-btn" data-go="submit">ارسال خبر در این بخش ←</button></div>`).join('')}</div><section class="panel section-gap"><div class="panel-header"><h3>${I('folder')} درباره بخش‌های خبری</h3></div><div class="panel-body"><div class="info-card">این نسخه ساده دارای چهار بخش نمونه است. هر خبر به دقیقاً یک بخش تعلق دارد، ولی یک بخش می‌تواند خبرهای زیادی از کاربران مختلف داشته باشد.</div></div></section>`};
function publicPage(){const list=reports.filter(r=>r.status==='approved'&&!r.deleted_at&&(publicFilter==='all'||r.program_id===Number(publicFilter)));return `${header('اخبار منتشرشده','خبرهای تأییدشده، قابل مشاهده برای تمام بازدیدکنندگان.')}<div class="filters">${[['all','همه خبرها'],...programs.map(p=>[String(p.id),p.name])].map(([k,l])=>`<button class="filter ${publicFilter===k?'active':''}" data-publicfilter="${k}">${l}</button>`).join('')}</div><div class="public-cards">${list.map(r=>`<article class="news-card" data-review="${r.id}"><div class="photo">${I('news')}</div><div class="copy"><span class="cat">${pName(r.program_id)}</span><h3>${safe(r.title)}</h3><p>${safe(r.summary.slice(0,125))}...</p><div class="foot"><span>${safe(r.author)}</span><span>${safe(r.published_at||r.created_at)}</span></div></div></article>`).join('')||empty('هنوز خبر منتشرشده‌ای در این بخش نیست.')}</div>`};
function usersPage(){return `${header('مدیریت کاربران','مدیران از میان کاربران موجود انتخاب می‌شوند.')}<section class="panel"><div class="panel-header"><h3>${I('users')} حساب‌های کاربری</h3></div><div class="panel-body"><div class="info-card" style="margin-bottom:17px"><strong>مدل پیشنهادی:</strong> همه افراد در جدول USERS هستند. مقدار فیلد <code>role</code> تعیین می‌کند حساب «کاربر» است یا «مدیر». این تغییر فقط باید توسط مدیر مجاز انجام شود.</div><div class="table-wrap"><table class="data-table"><thead><tr><th>شناسه</th><th>نام</th><th>نام کاربری</th><th>ایمیل</th><th>نقش</th><th>عملیات</th></tr></thead><tbody>${users.map(u=>`<tr><td>#${u.id}</td><td class="title-cell">${safe(u.name)}</td><td dir="ltr" style="text-align:right">${safe(u.username)}</td><td dir="ltr" style="text-align:right">${safe(u.email)}</td><td>${u.role==='admin'?'<span class="status approved">مدیر</span>':'<span class="status pending">کاربر</span>'}</td><td>${u.id===1?'<span class="muted">مدیر اصلی</span>':`<button class="button small secondary" data-promote="${u.id}">${u.role==='admin'?'تبدیل به کاربر':'انتخاب به عنوان مدیر'}</button>`}</td></tr>`).join('')}</tbody></table></div></div></section>`};
function authPage(){const reg=page==='register';document.getElementById('app').classList.remove('active');document.getElementById('auth').classList.remove('hidden');document.getElementById('auth').innerHTML=`<section class="auth-visual"><div class="brand-big"><span class="brand-mark">${I('news')}</span><div><h2>خبررسان</h2><small style="color:#9bbabb">سامانه مردمی ارسال و انتشار خبر</small></div></div><h1>هر خبر، <span>یک صدا</span><br/>برای دیده‌شدن شهر شماست.</h1><p>خبرهای خود را در بخش‌های مختلف ثبت کنید، وضعیت بررسی را دنبال کنید و در ساخت یک رسانه مردمی سهیم باشید.</p><div class="auth-dashes"><span></span><span></span><span></span></div><div style="position:absolute;bottom:35px;color:#669193;font-size:11px">نمونه تعاملی آموزشی — طراحی مطابق مرجع ارسالی</div></section><section class="auth-form-area"><div class="auth-form"><div class="eyebrow">${reg?'ایجاد حساب جدید':'ورود به سامانه'}</div><h1>${reg?'به جمع خبرنگاران بپیوندید':'خوش آمدید 👋'}</h1><p class="lead">${reg?'برای ارسال خبر یک حساب کاربری ایجاد کنید.':'برای ورود به داشبورد، اطلاعات حساب خود را وارد کنید.'}</p><form id="${reg?'register-form':'login-form'}">${reg?`<div class="field"><label>نام و نام خانوادگی</label><input name="name" class="control" required placeholder="نام کامل"/></div><div class="field"><label>نام کاربری</label><input name="username" class="control" required placeholder="نام کاربری یکتا"/></div>`:''}<div class="field"><label>${reg?'ایمیل':'ایمیل یا نام کاربری'}</label><input name="email" class="control" required placeholder="${reg?'you@example.com':'user@demo.test'}" dir="ltr" style="text-align:right"/></div><div class="field"><label>رمز عبور</label><input type="password" name="password" class="control" required minlength="4" placeholder="••••••••" dir="ltr" style="text-align:right"/></div><button class="button primary" type="submit">${I(reg?'users':'lock')} ${reg?'ساخت حساب کاربری':'ورود به داشبورد'}</button></form><div class="auth-links" style="margin-top:22px"><span>${reg?'قبلاً ثبت‌نام کرده‌اید؟':'حساب کاربری ندارید؟'}</span><button data-go="${reg?'login':'register'}">${reg?'ورود':'ثبت‌نام'}</button></div><button class="button secondary" style="margin-top:12px" type="button" data-go="public">${I('globe')} مشاهده اخبار بدون ورود</button><div class="demo-account"><div class="caption">ورود سریع برای امتحان نمونه — بدون نیاز به سرور</div><div class="demo-row"><button data-demo="user">${I('users')}<strong>دموی کاربر</strong></button><button data-demo="admin">${I('shield')}<strong>دموی مدیر</strong></button></div></div><div class="footnote">این فقط یک پروتوتایپ فرانت‌اند است و احراز هویت واقعی ندارد.</div></div></section>`};
function render(){if(page==='login'||page==='register'||(!session&&page!=='public'&&page!=='review')){authPage();return};document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.add('active');renderSidebar();const view=({dashboard:userDashboard,admin:adminDashboard,submit:submitPage,reports:reportsPage,review:reviewPage,programs:programsPage,public:publicPage,users:usersPage}[page]||userDashboard)();document.getElementById('main').innerHTML=view};
function modal(title,desc,buttons){document.getElementById('overlay').innerHTML=`<div class="modal-backdrop"><div class="modal"><h3>${title}</h3><p>${desc}</p><div class="form-actions">${buttons}</div></div></div>`};
function closeModal(){document.getElementById('overlay').innerHTML=''};
function recordDecision(choice){const r=reports.find(x=>x.id===reviewingId);if(!r)return;const feedback=document.getElementById('admin-feedback')?.value.trim()||'';if(['changes_requested','rejected'].includes(choice)&&!feedback){toast('لطفاً دلیل تصمیم را در قسمت توضیحات وارد کنید.');return};r.feedback=feedback;r.status=choice;if(choice==='approved')r.published_at=dateNow();if(choice==='removed')r.deleted_at=dateNow();persist();go('admin');toast(choice==='approved'?'خبر با موفقیت منتشر شد.':choice==='changes_requested'?'خبر برای اصلاح به کاربر برگردانده شد.':choice==='rejected'?'درخواست رد شد.':'خبر از نمایش عمومی حذف شد.')};
document.addEventListener('click',e=>{const btn=e.target.closest('[data-go],[data-demo],[data-review],[data-filter],[data-publicfilter],[data-decision],[data-promote],#logout,#edit-report,#show-notifications,#confirm-action,#close-modal');if(!btn)return;if(btn.dataset.go){if(btn.dataset.go==='submit')editingId=null;go(btn.dataset.go);return};if(btn.dataset.demo){setSession(btn.dataset.demo);return};if(btn.dataset.review){reviewingId=Number(btn.dataset.review);go('review');return};if(btn.dataset.filter){reportFilter=btn.dataset.filter;render();return};if(btn.dataset.publicfilter){publicFilter=btn.dataset.publicfilter;render();return};if(btn.dataset.decision){recordDecision(btn.dataset.decision);return};if(btn.dataset.promote){const u=users.find(x=>x.id===Number(btn.dataset.promote));if(!u||u.id===1)return;const next=u.role==='admin'?'user':'admin';modal('تغییر نقش کاربر',`آیا می‌خواهید نقش «${safe(u.name)}» را به «${next==='admin'?'مدیر':'کاربر'}» تغییر دهید؟`,`<button class="button secondary" id="close-modal">انصراف</button><button class="button primary" id="confirm-action" data-id="${u.id}" data-role="${next}">تأیید تغییر نقش</button>`);return};if(btn.id==='confirm-action'){const u=users.find(x=>x.id===Number(btn.dataset.id));if(u){u.role=btn.dataset.role;persist()};closeModal();render();toast('نقش کاربر با موفقیت تغییر کرد.');return};if(btn.id==='close-modal'){closeModal();return};if(btn.id==='logout'){session=null;persist();go('login');return};if(btn.id==='edit-report'){editingId=reviewingId;go('submit');return};if(btn.id==='show-notifications'){toast('در این نمونه، اعلان‌ها نمایشی هستند.');return}});
document.addEventListener('change',e=>{if(e.target.id==='media-input'){uploadFiles=Array.from(e.target.files||[]).map(f=>f.name);document.getElementById('file-names').textContent=uploadFiles.join('، ')||'فایلی انتخاب نشده است.'}});
document.addEventListener('submit',e=>{if(e.target.id==='login-form'){e.preventDefault();const data=new FormData(e.target);const email=String(data.get('email')||'').trim();const u=users.find(x=>x.email===email||x.username===email);if(u){session={...u};persist();go(u.role==='admin'?'admin':'dashboard');toast('ورود به نسخه نمایشی انجام شد.')}else toast('برای آزمایش، از دکمه‌های «دموی کاربر» یا «دموی مدیر» استفاده کنید.');return};if(e.target.id==='register-form'){e.preventDefault();const data=new FormData(e.target),email=String(data.get('email')).trim(),username=String(data.get('username')).trim();if(users.some(u=>u.email===email||u.username===username)){toast('نام کاربری یا ایمیل تکراری است.');return};const u={id:Math.max(...users.map(x=>x.id))+1,name:String(data.get('name')),username,email,role:'user'};users.push(u);session={...u};persist();go('dashboard');toast('حساب نمایشی شما ساخته شد.');return};if(e.target.id==='submit-form'){e.preventDefault();const data=new FormData(e.target),title=String(data.get('title')||'').trim(),summary=String(data.get('summary')||'').trim(),program_id=Number(data.get('program_id'));if(title.length<4||summary.length<20||!program_id){toast('عنوان و متن کامل خبر را وارد کنید.');return};if(editingId){const r=reports.find(x=>x.id===editingId&&x.user_id===session.id);if(!r||r.status!=='changes_requested'){toast('این خبر در وضعیت قابل ویرایش نیست.');return};Object.assign(r,{title,summary,program_id,status:'pending',feedback:'',files:[...new Set([...r.files,...uploadFiles])],published_at:null});editingId=null}else{reports.unshift({id:Math.max(1208,...reports.map(x=>x.id))+1,title,summary,program_id,user_id:session.id,author:session.name,status:'pending',feedback:'',published_at:null,deleted_at:null,created_at:dateNow(),files:uploadFiles})};uploadFiles=[];persist();go('reports');toast('خبر با موفقیت در صف بررسی قرار گرفت.');return}});
render();
})();
</script>
</body>
</html>
